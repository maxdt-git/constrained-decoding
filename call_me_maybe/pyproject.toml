[project]
name = "call_me_maybe"
version = "0.1.0"
description = "Function calling with constrained decoding"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
    "llm-sdk",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
]

[tool.uv]
package = false

[tool.mypy]
exclude = ["^llm_sdk/"]
namespace_packages = false
